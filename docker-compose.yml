services:
  # La Base de Datos Local (Puerto externo 5433 para liberar el 5432)
  postgres_db:
    image: postgres:15-alpine
    container_name: quickeats_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: admin123
      POSTGRES_DB: delivery_db
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - quickeats_network

  # API Gateway (Puerto 3001)
  gateway:
    build:
      context: ./gateway
      dockerfile: Dockerfile
    container_name: quickeats_gateway
    restart: unless-stopped
    ports:
      - "3001:3001"
    env_file:
      - ./gateway/.env
    depends_on:
      - auth-service
      - restaurant-service
      - order-service
      - notification-service
    networks:
      - quickeats_network

  # Auth Service (Puerto 3002 - Conectado a Supabase de forma estable)
  auth-service:
    build:
      context: ./auth-service
      dockerfile: Dockerfile
      target: builder 
    container_name: quickeats_auth
    restart: unless-stopped
    ports:
      - "3002:3002"
    env_file:
      - ./auth-service/.env
    volumes:
      - ./auth-service:/app:z 
      - /app/node_modules
    # 🌟 CAMBIO: Ejecución explícita del binario local de Nest
    command: sh -c "npx prisma generate && ./node_modules/.bin/nest start --watch"
    networks:
      - quickeats_network

  # Restaurant Service (Puerto 3003 - Con volumen de desarrollo también)
  restaurant-service:
    build:
      context: ./restaurant-service
      dockerfile: Dockerfile
      target: builder
    container_name: quickeats_restaurant
    restart: unless-stopped
    ports:
      - "3003:3003"
    env_file:
      - ./restaurant-service/.env
    environment:
      - NODE_TLS_REJECT_UNAUTHORIZED=0
      - TZ=America/Lima
    volumes:
      - ./restaurant-service:/app:z
      - /app/node_modules
    # 🌟 CAMBIO: Homologamos el comportamiento de desarrollo vivo
    command: sh -c "npx prisma generate && ./node_modules/.bin/nest start --watch"
    networks:
      - quickeats_network

  # Order Service (Puerto 3004)
  order-service:
    build:
      context: ./order-service
      dockerfile: Dockerfile
      target: builder
    container_name: quickeats_order
    restart: unless-stopped
    ports:
      - "3004:3004"
    env_file:
      - ./order-service/.env
    environment:
      - NODE_TLS_REJECT_UNAUTHORIZED=0
      - TZ=America/Lima
    volumes:
      - ./order-service:/app:z 
      - /app/node_modules
    # 🌟 CAMBIO: Ejecución explícita para evitar que falle con npx o npm run
    command: sh -c "npx prisma generate && ./node_modules/.bin/nest start --watch"
    networks:
      - quickeats_network

  # Notification Service (Puerto 3005)
  notification-service:
    build:
      context: ./notification-service
      dockerfile: Dockerfile
      target: builder
    container_name: quickeats_notification
    restart: unless-stopped
    ports:
      - "3005:3005"
    env_file:
      - ./notification-service/.env
    environment:
      - NODE_TLS_REJECT_UNAUTHORIZED=0
      - TZ=America/Lima
    volumes:
      - ./notification-service:/app:z
      - /app/node_modules
    # 🌟 CAMBIO: Mismo comando directo al ejecutable de Linux
    command: sh -c "npx prisma generate && ./node_modules/.bin/nest start --watch"
    networks:
      - quickeats_network

volumes:
  postgres_data:

networks:
  quickeats_network:
    driver: bridge