services:
  postgres_db:
    image: postgres:15-alpine
    container_name: quickeats_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: admin123
      POSTGRES_DB: delivery_db
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - quickeats_network

  gateway:
    build:
      context: ./gateway
      dockerfile: Dockerfile
    container_name: quickeats_gateway
    restart: unless-stopped
    ports:
      - "3001:3001"
    env_file:
      - ./gateway/.env
    depends_on:
      - auth-service
      - restaurant-service
      - order-service
      - notification-service
    networks:
      - quickeats_network

  auth-service:
    build:
      context: ./auth-service
      dockerfile: Dockerfile
      target: builder 
    container_name: quickeats_auth
    restart: unless-stopped
    ports:
      - "3002:3002"
    env_file:
      - ./auth-service/.env
    environment:
      - TZ=America/Lima
    volumes:
      - ./auth-service:/app:z 
      - /app/node_modules
      - ./auth-service/supabase-ca.crt:/app/supabase-ca.crt:z
    command: sh -c "npx prisma generate && ./node_modules/.bin/nest start --watch"
    networks:
      - quickeats_network

  restaurant-service:
    build:
      context: ./restaurant-service
      dockerfile: Dockerfile
      target: builder
    container_name: quickeats_restaurant
    restart: unless-stopped
    ports:
      - "3003:3003"
    env_file:
      - ./restaurant-service/.env
    environment:
      - TZ=America/Lima
    volumes:
      - ./restaurant-service:/app:z
      - /app/node_modules
      - ./restaurant-service/supabase-ca.crt:/app/supabase-ca.crt:z
    command: sh -c "npx prisma generate && ./node_modules/.bin/nest start --watch"
    networks:
      - quickeats_network

  order-service:
    build:
      context: ./order-service
      dockerfile: Dockerfile
      target: builder
    container_name: quickeats_order
    restart: unless-stopped
    ports:
      - "3004:3004"
    env_file:
      - ./order-service/.env
    environment:
      - TZ=America/Lima
      # En Docker el order-service alcanza al notification-service por su DNS interno
      - NOTIFICATION_SERVICE_URL=http://notification-service:3005
    volumes:
      - ./order-service:/app:z 
      - /app/node_modules
      - ./order-service/supabase-ca.crt:/app/supabase-ca.crt:z
    command: sh -c "npx prisma generate && ./node_modules/.bin/nest start --watch"
    networks:
      - quickeats_network

  notification-service:
    build:
      context: ./notification-service
      dockerfile: Dockerfile
      target: builder
    container_name: quickeats_notification
    restart: unless-stopped
    ports:
      - "3005:3005"
    env_file:
      - ./notification-service/.env
    environment:
      - TZ=America/Lima
    volumes:
      - ./notification-service:/app:z
      - /app/node_modules
      - ./notification-service/supabase-ca.crt:/app/supabase-ca.crt:z
    command: sh -c "npx prisma generate && ./node_modules/.bin/nest start --watch"
    networks:
      - quickeats_network

volumes:
  postgres_data:

networks:
  quickeats_network:
    driver: bridge