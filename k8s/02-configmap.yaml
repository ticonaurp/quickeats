# ⚙️ ConfigMap con las URLs internas entre servicios.
# Dentro del clúster cada servicio se resuelve por el NOMBRE de su Service (DNS de Kubernetes),
# igual que el DNS de Docker Compose. Ej: el gateway alcanza al auth en http://auth-service:3002.
apiVersion: v1
kind: ConfigMap
metadata:
  name: quickeats-config
  namespace: quickeats
data:
  AUTH_SERVICE_URL: "http://auth-service:3002"
  RESTAURANT_SERVICE_URL: "http://restaurant-service:3003"
  ORDER_SERVICE_URL: "http://order-service:3004"
  NOTIFICATION_SERVICE_URL: "http://notification-service:3005"
