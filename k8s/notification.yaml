apiVersion: apps/v1
kind: Deployment
metadata:
  name: notification-service
  namespace: quickeats
spec:
  replicas: 1
  selector:
    matchLabels:
      app: notification-service
  template:
    metadata:
      labels:
        app: notification-service
    spec:
      containers:
        - name: notification-service
          image: quickeats-notification-service:latest
          imagePullPolicy: IfNotPresent
          # OJO: este servicio compila en dist/src/main.js (no dist/main.js).
          command: ["node", "dist/src/main.js"]
          ports:
            - containerPort: 3005
          env:
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: quickeats-secrets
                  key: DATABASE_URL_NOTIFICATION
---
apiVersion: v1
kind: Service
metadata:
  name: notification-service
  namespace: quickeats
spec:
  selector:
    app: notification-service
  ports:
    - port: 3005
      targetPort: 3005
  type: ClusterIP
